name: Desktop Flutter checks

on:
  push:
    branches:
      - develop/v1.5
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-flutter-check.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-flutter-check.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart sources
        run: flutter analyze
      - name: Run unit tests
        run: flutter test
