name: Web vacation planner checks

on:
  push:
    branches:
      - develop/v1.5
    paths:
      - 'assets/urlaubsplaner*.js'
      - 'tests/urlaubsplaner.test.cjs'
      - '.github/workflows/web-vacation-check.yml'
  pull_request:
    paths:
      - 'assets/urlaubsplaner*.js'
      - 'tests/urlaubsplaner.test.cjs'
      - '.github/workflows/web-vacation-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/urlaubsplaner-store.js
      - run: node --check assets/urlaubsplaner.js
      - run: node --check assets/pep.js
      - run: node --test tests/urlaubsplaner.test.cjs
