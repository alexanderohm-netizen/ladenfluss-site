name: Web stability checks

on:
  push:
    branches: [main, develop/v1.5, fix/v1.5.1-stability]
    paths: ['assets/**', '**/*.html', 'supabase/**', 'tests/**', 'package*.json', '.github/workflows/web-vacation-check.yml']
  pull_request:
    paths: ['assets/**', '**/*.html', 'supabase/**', 'tests/**', 'package*.json', '.github/workflows/web-vacation-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: for file in assets/*.js; do node --check "$file"; done
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladenfluss-web-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
