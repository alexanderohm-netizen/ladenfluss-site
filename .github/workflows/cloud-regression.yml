name: Cloud regression tests
on:
  push:
    branches:
      - feature/cloud-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ladenfluss-cloud-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run domain and Cloud regression tests
        run: npm test
      - name: Install browser for integration tests
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:browser
